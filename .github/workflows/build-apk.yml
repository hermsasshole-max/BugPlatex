name: Build SplatDex Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Dependencies
        run: |
          npm install

      - name: Build Web Application
        run: |
          npm run build

      - name: Sync Web Assets to Android
        run: |
          if [ -d "android" ] && [ -f "android/build.gradle" ]; then
            echo "Syncing web assets to Capacitor android project..."
            npx cap sync android
          else
            echo "Syncing web assets to root Android project assets/www..."
            mkdir -p app/src/main/assets/www
            cp -r www/* app/src/main/assets/www/
          fi

      - name: Prepare Gradle Wrapper
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          elif [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "Gradle wrapper missing from repo; generating wrapper via system Gradle..."
            gradle wrapper
            chmod +x ./gradlew
          fi

      - name: Build Android Debug APK
        run: |
          if [ -f "android/gradlew" ]; then
            echo "Building from android/ directory using ./gradlew..."
            cd android && ./gradlew assembleDebug --stacktrace
          elif [ -f "./gradlew" ]; then
            echo "Building from root directory using ./gradlew..."
            ./gradlew assembleDebug --stacktrace
          else
            echo "Building with system Gradle..."
            gradle assembleDebug --stacktrace
          fi

      - name: Locate Output APK
        id: apk-path
        run: |
          APK_FILE=$(find . -name "*.apk" | grep -E "debug" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: Could not find generated debug APK file!"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SplatDex-debug-apk
          path: ${{ steps.apk-path.outputs.apk_path }}
          retention-days: 14
